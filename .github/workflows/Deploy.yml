name: Deploy

# Déploie PrintIOS (site Next.js + API Laravel + worker dans UNE
# image, voir Dockerfile à la racine) sur UN service AWS Lightsail Container —
# même mécanique que les pipelines Packspace : build ici, push avec
# `aws lightsail push-container-image`, puis déploiement. Aucun secret dans
# l'image : tout passe par "environment" du déploiement, alimenté par
# l'environnement GitHub "PrintIOS".
#
# À CRÉER AVANT LE PREMIER RUN (détail dans le README, "Déploiement AWS") :
#   Lightsail : service container `printios` (Micro conseillé : Next + PHP +
#               worker dans le même conteneur), base MySQL `printios_boutique`.
#   GitHub → Settings → Environments → "PrintIOS" :
#     secrets : AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, APP_KEY,
#               DB_PASSWORD, MAIL_PASSWORD
#     vars    : AWS_REGION, LIGHTSAIL_SERVICE (=printios),
#               SITE_URL (https://printios.ma),
#               DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME,
#               MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_FROM_ADDRESS,
#               NOTIFY_EMAIL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'API/**'
      - 'UI/**'
      - 'docker/**'
      - 'Dockerfile'
      - '.github/workflows/Deploy.yml'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PrintIOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upgrade AWS CLI and setup lightsailctl
        run: |
          curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update
          sudo curl -s "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" -o /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl
          aws --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build Docker image
        run: |
          VERSION="${{ github.run_number }}"
          docker build -t printios:$VERSION \
            --build-arg NEXT_PUBLIC_API_URL=/api \
            --build-arg NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }} .

      - name: Push image to Lightsail
        run: |
          VERSION="${{ github.run_number }}"
          aws lightsail push-container-image \
            --service-name ${{ vars.LIGHTSAIL_SERVICE }} \
            --label printios-$VERSION \
            --image printios:$VERSION

      - name: Resolve pushed image name
        run: |
          echo "LIGHTSAIL_DOCKER_IMAGE=$(aws lightsail get-container-images --service-name ${{ vars.LIGHTSAIL_SERVICE }} --region ${{ vars.AWS_REGION }} | jq -r .containerImages[0].image)" >> $GITHUB_ENV

      - name: Deploy to Lightsail
        run: |
          aws lightsail create-container-service-deployment --region ${{ vars.AWS_REGION }} \
          --service-name ${{ vars.LIGHTSAIL_SERVICE }} \
          --output yaml \
          --containers "{
            \"app\": {
              \"image\": \"$LIGHTSAIL_DOCKER_IMAGE\",
              \"ports\": { \"8080\": \"HTTP\" },
              \"environment\": {
                \"APP_NAME\": \"PrintIOS\",
                \"APP_ENV\": \"production\",
                \"APP_DEBUG\": \"false\",
                \"APP_KEY\": \"${{ secrets.APP_KEY }}\",
                \"APP_URL\": \"${{ vars.SITE_URL }}\",
                \"APP_TIMEZONE\": \"Africa/Casablanca\",
                \"APP_LOCALE\": \"fr\",
                \"LOG_CHANNEL\": \"stderr\",
                \"LOG_LEVEL\": \"info\",
                \"DB_CONNECTION\": \"mysql\",
                \"DB_HOST\": \"${{ vars.DB_HOST }}\",
                \"DB_PORT\": \"${{ vars.DB_PORT }}\",
                \"DB_DATABASE\": \"${{ vars.DB_DATABASE }}\",
                \"DB_USERNAME\": \"${{ vars.DB_USERNAME }}\",
                \"DB_PASSWORD\": \"${{ secrets.DB_PASSWORD }}\",
                \"QUEUE_CONNECTION\": \"database\",
                \"CACHE_STORE\": \"database\",
                \"SESSION_DRIVER\": \"file\",
                \"MAIL_MAILER\": \"smtp\",
                \"MAIL_HOST\": \"${{ vars.MAIL_HOST }}\",
                \"MAIL_PORT\": \"${{ vars.MAIL_PORT }}\",
                \"MAIL_USERNAME\": \"${{ vars.MAIL_USERNAME }}\",
                \"MAIL_PASSWORD\": \"${{ secrets.MAIL_PASSWORD }}\",
                \"MAIL_ENCRYPTION\": \"tls\",
                \"MAIL_FROM_ADDRESS\": \"${{ vars.MAIL_FROM_ADDRESS }}\",
                \"MAIL_FROM_NAME\": \"PrintIOS\",
                \"BRAND_NAME\": \"PrintIOS\",
                \"SITE_URL\": \"${{ vars.SITE_URL }}\",
                \"SITE_ORIGINS\": \"${{ vars.SITE_URL }}\",
                \"TRIAL_DAYS\": \"7\",
                \"NOTIFY_EMAIL\": \"${{ vars.NOTIFY_EMAIL }}\",
                \"NEXT_PUBLIC_SITE_URL\": \"${{ vars.SITE_URL }}\",
                \"NEXT_PUBLIC_API_URL\": \"/api\"
              }
            }
          }" \
          --public-endpoint "{
            \"containerName\": \"app\",
            \"containerPort\": 8080,
            \"healthCheck\": {
              \"path\": \"/api/ping\",
              \"intervalSeconds\": 30,
              \"timeoutSeconds\": 5,
              \"healthyThreshold\": 2,
              \"unhealthyThreshold\": 3
            }
          }"
