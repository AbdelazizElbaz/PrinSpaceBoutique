# PrintIOS en local avec Docker : un conteneur applicatif (site + API +
# worker + scheduler) et MySQL.
#   cp API/.env.example API/.env   (renseigner PLATFORM_API_TOKEN, MAIL_*)
#   docker compose up -d --build   → http://localhost:8080
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: printios_boutique
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_SITE_URL: http://localhost:8080
    env_file: ./API/.env
    environment:
      DB_HOST: db
      DB_DATABASE: printios_boutique
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      SITE_URL: http://localhost:8080
      SITE_ORIGINS: http://localhost:8080
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
