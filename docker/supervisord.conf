[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:next]
command=node /var/www/web/server.js
directory=/var/www/web
; Next standalone écoute sur $HOSTNAME ; Lightsail le positionne au nom du
; conteneur → nginx (127.0.0.1:3100) répondait 502. On force 0.0.0.0 (défaut
; Next). Pas 127.0.0.1 : NextURL le normalise en "localhost" et le routeur
; prend alors les réécritures du middleware pour des URLs externes.
environment=HOSTNAME="0.0.0.0",PORT="3100"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=php /var/www/api/artisan queue:work --tries=1 --sleep=3 --max-time=3600
directory=/var/www/api
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
