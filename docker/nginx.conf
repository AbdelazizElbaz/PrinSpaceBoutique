# Façade unique du conteneur PrintIOS (port 8080)
# Fichier inclus dans le bloc http{} de nginx : les directives de contexte http (map, limit_req_zone) sont donc permises ici.

server_tokens off;

# --- IP réelle du visiteur -------------------------------------------------------------------------------------------
# Cloudflare -> load balancer Lightsail -> nginx : $remote_addr est l'adresse du load balancer. Ordre de confiance :
#   1. CF-Connecting-IP (posé par Cloudflare, non forgeable par le visiteur) ;
#   2. premier saut de X-Forwarded-For (repli : forgeable, ne sert qu'aux requêtes qui n'ont pas traversé Cloudflare) ;
#   3. $remote_addr.
# Sert au rate limiting nginx ET à Laravel (REMOTE_ADDR ci-dessous) : le limiteur de Laravel ne se fie plus à
# X-Forwarded-For, qu'un client forge. Seules de vraies adresses IP sont acceptées (pas de texte libre).
map $http_cf_connecting_ip $cf_ip {
    default "";
    "~^[0-9a-fA-F:.]{3,45}$" $http_cf_connecting_ip;
}
map $http_x_forwarded_for $xff_first {
    default "";
    "~^\s*(?<hop>[0-9a-fA-F:.]{3,45})\s*(?:,|$)" $hop;
}
map "$cf_ip|$xff_first" $client_ip {
    default $remote_addr;
    "~^(?<a>[^|]+)\|" $a;
    "~^\|(?<b>.+)$" $b;
}

# --- Robots / scanners : refus avant d'atteindre PHP ou Next.js ------------------------------------------------------
map $http_user_agent $bad_agent {
    default 0;
    "~*(sqlmap|nikto|nmap|masscan|zgrab|dirbuster|gobuster|feroxbuster|wpscan|nuclei|acunetix|havij|netsparker|openvas|jaeles|leakix|censys|shodan)" 1;
}

# --- Limites de débit (par IP visiteur) ------------------------------------------------------------------------------
limit_req_zone $client_ip zone=site:10m rate=20r/s;
limit_req_zone $client_ip zone=api:10m  rate=10r/s;
limit_req_status 429;
limit_conn_zone $client_ip zone=perip:10m;
limit_conn_status 429;

server {
    listen 8080;
    server_name _;

    # Corps : l'API ne reçoit que de petits JSON (chat <= 2000 caractères, formulaires).
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;
    # Anti-slowloris
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 20s;
    keepalive_timeout 30s;

    limit_conn perip 40;

    # Méthodes inutiles (TRACE, PUT, DELETE, PROPFIND…) : le site n'utilise que GET / HEAD / POST / OPTIONS.
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
        return 405;
    }
    if ($bad_agent) {
        return 403;
    }

    # --- Chemins de scanners : 404 immédiat (sans rendre la page 404 de Next, coûteuse sur un conteneur nano) --------
    # Fichiers cachés (.env, .git, .htaccess, .DS_Store…), sauf /.well-known.
    location ~ /\.(?!well-known/) {
        access_log off;
        return 404;
    }
    # Extensions que ce site ne sert jamais : secrets, sauvegardes, scripts serveur, cartes de sources, archives.
    location ~* \.(?:map|env|ini|conf|cnf|yml|yaml|toml|sql|sqlite|db|bak|old|orig|save|swp|log|sh|bash|py|pl|rb|cgi|asp|aspx|jsp|jspx|php[0-9]?|phtml|inc|lock|tar|gz|tgz|zip|rar|7z|key|pem|crt|pfx)$ {
        access_log off;
        return 404;
    }
    # Panneaux et outils de développement recherchés par les scanners (le chemin /admin du site n'est PAS concerné :
    # seul /admin/messages existe, protégé par mot de passe).
    location ~* ^/(?:wp-admin|wp-login|wp-content|wp-includes|wp-json|wordpress|xmlrpc|phpmyadmin|pma|adminer|filament|nova|telescope|horizon|vendor|storage|_ignition|_profiler|_debugbar|__vite|__webpack|@fs|@vite|@id|actuator|swagger|api-docs|graphql|server-status|server-info|cgi-bin|boaform|hnap1|owa|ecp|solr|jenkins|manager|console|api-keys|apikeys|\.git|\.svn)(?:/|$) {
        access_log off;
        return 404;
    }

    # /up : healthcheck sondé par le load balancer, jamais limité.
    location = /up {
        root /var/www/api/public;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_hide_header X-Powered-By;
        access_log off;
    }

    # API Laravel : /api/*
    location ~ ^/api(/|$) {
        root /var/www/api/public;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # IP réelle du visiteur (voir map ci-dessus) : Laravel la lit dans REMOTE_ADDR.
        fastcgi_param REMOTE_ADDR $client_ip;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
        limit_req zone=api burst=40 nodelay;
    }

    # Assets Next.js : cache long (fichiers statiques, non limités : une page en charge des dizaines)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Site Next.js (server.js standalone sur 3100)
    location / {
        limit_req zone=site burst=60 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_hide_header X-Powered-By;
        # En-tête interne de Next (réécriture du middleware), inutile et bavard côté client.
        proxy_hide_header X-Middleware-Rewrite;
        proxy_read_timeout 60;
    }
}
